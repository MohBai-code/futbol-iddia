name: Haftalık rapor

on:
  schedule:
    - cron: "17 15 * * 2,5"  # salı ve cuma 18:17 (Türkiye saati)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rapor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy pytest
      - run: python -m pytest -q
      - run: python -m iddia indir
      - run: python -m iddia backtest | tee reports/backtest.txt
      - run: python -m iddia rapor
      - run: python -m iddia benzer-rapor
      - name: Raporu depoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || git commit -m "Rapor: $(date +%F)"
          git push
